# SPDX-License-Identifier: MIT
# meson2hermetic project configuration for the Kernarium Mesa Soong port: the
# Venus Vulkan HAL and the Virgl EGL and GLES libraries.
[project]
project_name = "aosp_mesa_venus"
project_path = "external/mesa3d-venus"
build_system = "soong"

[copyright]
license_name = "external_mesa3d_venus_license"
licenses = ["MIT", "Apache-2.0", "GPL-1.0-or-later", "GPL-2.0-only"]
license_texts = ["licenses/MIT", "licenses/Apache-2.0", "licenses/GPL-1.0-or-later", "licenses/GPL-2.0-only"]

[target_renames]
vulkan_virtio = "vulkan.virtio"
EGL_kernarium = "libEGL_kernarium"
GLESv1_CM_kernarium = "libGLESv1_CM_kernarium"
GLESv2_kernarium = "libGLESv2_kernarium"

[[config]]
config_name = "kernarium_venus"

[config.platforms]
host_platforms = ["android_uml_arm64", "android_uml_arm"]
build_platforms = ["linux_glibc_x86_64"]

[config.static_options]
glx = "disabled"
zlib = "disabled"
platforms = "android"
android-strict = false
android-libbacktrace = "disabled"
vulkan-drivers = "virtio"
gallium-drivers = "virgl"
opengl = true
egl = "enabled"
gles1 = "enabled"
gles2 = "enabled"
gbm = "disabled"
llvm = "disabled"
libunwind = "disabled"
valgrind = "disabled"
xmlconfig = "disabled"
venus-protocol-dir = ""
egl-lib-suffix = "_kernarium"
gles-lib-suffix = "_kernarium"

# Read by generate-mesa-venus-port.py; the converter ignores this table. The
# Soong arch of each host platform: the first platform is the default, and the
# generator names a generated source that differs between platforms after it.
[kernarium.platform_arch]
android_uml_arm64 = "arm64"
android_uml_arm = "arm"

# Soong makes every warning an error in a project outside device/ and vendor/,
# which Meson's build of Mesa does not. An exception keeps one warning that
# Mesa's own build tolerates from failing one module.
[[kernarium.warning_exception]]
module = "virgl"
conlyflags = ["-Wno-error=sometimes-uninitialized"]
reason = """virgl_encoder_transfer3d_common() leaves stride and layer_stride unset
only on the path its enum rules out, which ends in an assert that release builds
compile away."""
