# SPDX-License-Identifier: MIT
# meson2hermetic platform description for the Kernarium Mesa Soong port.
#
# The converter does not run a compiler. It answers every Meson configure-time
# check from the tables below: a check passes unless it is listed under
# `fails`, a type has the size and alignment given or eight bytes, and so on.
# Each platform therefore records how Mesa's checks come out for AOSP's clang
# and Bionic when it builds for that instruction set. The two Android platforms
# differ only where the instruction set decides: a 32-bit ARM target has no
# `__uint128_t` and four-byte pointers. The build platform names the host that
# runs the generators.
#
# `tools/generate-mesa-venus-port.py soong` hands this file to the converter.
# A change here changes the generated port.

[[platform]]
name = "android_uml_arm64"

[platform.machine_info]
cpu_family = "aarch64"
cpu = "aarch64"
system = "android"
endian = "little"

[platform.c]
compiler_id = "clang"
linker_id = "ld.lld"
version = "21.0.0"

# Options clang rejects (they are GCC-only).
[platform.c.supported_arguments.fails]
args = [
    "-Wno-error=maybe-uninitialized",
    "-Wno-nonnull-compare",
    "-flifetime-dse=1",
]

# Headers Bionic does not provide.
[platform.c.check_header.fails]
"pthread_np.h" = true
"sys/sysctl.h" = true

# Functions and builtins the toolchain does not provide at the API level the
# port targets: GCC-only builtins, and the builtins of other instruction sets,
# which clang spells differently or not at all.
[platform.c.has_function.fails]
"pthread_setaffinity_np" = true
"random_r" = true
"qsort_s" = true
"secure_getenv" = true
"__builtin_add_overflow_p" = true
"__builtin_sub_overflow_p" = true
"__builtin_arm_get_fpscr" = true
"__builtin_arm_set_fpscr" = true
"__builtin_aarch64_get_fpcr" = true
"__builtin_aarch64_set_fpcr" = true
"__builtin_ia32_clflushopt" = true

[platform.c.has_function_attribute.fails]
optimize = true

[platform.c.has_header_symbol.fails."errno.h"]
program_invocation_name = true

[platform.c.has_header_symbol.fails."math.h"]
issignaling = true

[platform.c.has_header_symbol.fails."sys/mkdev.h"]
major = true
minor = true
makedev = true

# A version script names a file Meson generates in its build directory, which
# the port does not ship, so the check fails and no library names one. Neither
# form of qsort_r is available.
[platform.c.links.fails]
version-script = true
"GNU qsort_r" = true
"BSD qsort_r" = true

[platform.cpp]
compiler_id = "clang"
linker_id = "ld.lld"
version = "21.0.0"

# Options clang rejects (they are GCC-only).
[platform.cpp.supported_arguments.fails]
args = [
    "-Wno-error=maybe-uninitialized",
    "-Wno-nonnull-compare",
    "-flifetime-dse=1",
]

# Headers Bionic does not provide.
[platform.cpp.check_header.fails]
"pthread_np.h" = true
"sys/sysctl.h" = true

# Functions and builtins the toolchain does not provide at the API level the
# port targets: GCC-only builtins, and the builtins of other instruction sets,
# which clang spells differently or not at all.
[platform.cpp.has_function.fails]
"pthread_setaffinity_np" = true
"random_r" = true
"qsort_s" = true
"secure_getenv" = true
"__builtin_add_overflow_p" = true
"__builtin_sub_overflow_p" = true
"__builtin_arm_get_fpscr" = true
"__builtin_arm_set_fpscr" = true
"__builtin_aarch64_get_fpcr" = true
"__builtin_aarch64_set_fpcr" = true
"__builtin_ia32_clflushopt" = true

[platform.cpp.has_function_attribute.fails]
optimize = true

[platform.cpp.has_header_symbol.fails."errno.h"]
program_invocation_name = true

[platform.cpp.has_header_symbol.fails."math.h"]
issignaling = true

[platform.cpp.has_header_symbol.fails."sys/mkdev.h"]
major = true
minor = true
makedev = true

# A version script names a file Meson generates in its build directory, which
# the port does not ship, so the check fails and no library names one. Neither
# form of qsort_r is available.
[platform.cpp.links.fails]
version-script = true
"GNU qsort_r" = true
"BSD qsort_r" = true

