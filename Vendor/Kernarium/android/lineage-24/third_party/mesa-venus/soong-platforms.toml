# A 32-bit ARM target has no 128-bit integer.
[platform.c.compiles.fails]
"__uint128_t" = true

# Four-byte pointers and longs. Other types have the eight-byte default.
[platform.c.sizeof.sizes]
"void*" = 4
"void *" = 4
"size_t" = 4
"long" = 4
"unsigned long" = 4
"ptrdiff_t" = 4
"intptr_t" = 4
"uintptr_t" = 4

