# Équivalent XcodeGen du projet TriOS.xcodeproj fourni.
# Régénérer avec : xcodegen generate
name: TriOS
options:
  bundleIdPrefix: fr.trios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
targets:
  TriOS:
    type: application
    platform: iOS
    sources:
      - path: TriOS
        excludes: ["Info.plist", "TriOS.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.trios.unified
        INFOPLIST_FILE: TriOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: TriOS/TriOS.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: TriOS/TriOS-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        baseConfigurationReference: Config/Engines.xcconfig
