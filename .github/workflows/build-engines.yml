name: Build engines (experimental)

# Tentative de construction des trois moteurs natifs depuis Vendor/,
# avec LEURS systèmes de build d'origine. Déclenchement manuel
# uniquement : chaque moteur a des prérequis externes lourds
# (Henge -> checkout Husk ; Kernarium -> préfixes statiques privés
# via dependencies/prepare.sh ; LinuxRunner -> sous-modules + Meson,
# et ANGLE/virglrenderer pour la variante GPU).
# Les jobs sont en continue-on-error : un moteur qui échoue
# n'empêche pas les autres, et chaque job publie son journal.

on:
  workflow_dispatch:

jobs:
  henge-lib:
    name: Henge libhengevm.a
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install meson ninja pkg-config
      - name: Clone Husk (dependency of Henge)
        run: git clone --depth 1 https://github.com/Leviidev/Husk "$HOME/Husk"
      - name: Build Husk iOS pieces (sysroot + rppairing)
        run: |
          cd "$HOME/Husk"
          rustup target add aarch64-apple-ios
          bash scripts/fetch_sources.sh
          bash scripts/build_ios.sh libffi glib libslirp || { echo "--- journaux Husk ---"; tail -n 80 build/logs/*.log; exit 1; }
          bash scripts/build_rppairing_ios.sh || { echo "--- rppairing en échec ---"; exit 1; }
          ls build/ios-arm64/lib build/ios-arm64/sysroot/lib
      - name: Fetch deps + make ios-lib
        run: |
          cd Vendor/Henge
          export HUSK="$HOME/Husk"
          ios/scripts/fetch_deps.sh
          make ios-lib IOS_DEPS="$HOME/Husk/build/ios-arm64/sysroot"
      - uses: actions/upload-artifact@v4
        with:
          name: henge-lib
          path: Vendor/Henge/build/ios/
          if-no-files-found: warn

  linuxrunner-core:
    name: LinuxRunner app (interpreter, unsigned IPA)
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install meson ninja cmake pkg-config lld
      - name: Populate pinned submodules
        run: bash Scripts/setup-linuxrunner-deps.sh
      - name: Build LinuxRunner (interpreter/software variant)
        run: |
          cd Vendor/LinuxRunner
          scripts/build-ipa.sh --unsigned
          python3 scripts/verify-ipa.py build/releases || true
          ls -la build/releases/
      - uses: actions/upload-artifact@v4
        with:
          name: linuxrunner-build
          path: |
            Vendor/LinuxRunner/build/releases/
            Vendor/LinuxRunner/build/release-derived/Build/Products/
          if-no-files-found: warn

  kernarium-check:
    name: Kernarium dependencies check
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install cmake ninja || true
      - name: Prepare dependencies (no fetch)
        run: |
          cd Vendor/Kernarium
          dependencies/prepare.sh --no-fetch || true
          ls .build/kernarium-xcframeworks || true
