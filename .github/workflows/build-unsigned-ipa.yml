name: Build unsigned IPA

# Construit TriOS (interface + tout moteur lié présent dans le dépôt)
# SANS signature, et publie un .ipa « unsigned » en artefact.
# Installation ensuite via SideStore / AltStore / TrollStore,
# qui re-signent l'IPA avec ton certificat.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: TriOS unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TriOS.xcodeproj \
            -scheme TriOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'TriOS.app' | head -1)"
          echo "App : $APP_PATH"
          test -n "$APP_PATH"
          rm -rf build/Payload build/TriOS-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry TriOS-unsigned.ipa Payload)
          ls -lh build/TriOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriOS-unsigned-ipa
          path: build/TriOS-unsigned.ipa
          if-no-files-found: error
