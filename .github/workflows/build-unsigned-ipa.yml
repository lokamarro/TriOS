name: Build unsigned IPA

# Construit TriOS SANS signature, avec le moteur Henge lié
# (HENGE_LINKED) : les pièces iOS de Husk et les bibliothèques de
# Vendor/Henge sont construites dans le même job, puis
# Config/Engines.xcconfig est généré pour lier le moteur.
# Publie un .ipa « unsigned » en artefact. Installation ensuite via
# SideStore / AltStore / TrollStore, qui re-signent l'IPA.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: TriOS unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install toolchain
        run: brew install meson ninja pkg-config cmake lld

      - name: Clone Husk (dependency of Henge)
        run: git clone --depth 1 https://github.com/Leviidev/Husk "$HOME/Husk"

      - name: Build Husk iOS pieces (sysroot + rppairing)
        run: |
          cd "$HOME/Husk"
          rustup target add aarch64-apple-ios
          bash scripts/fetch_sources.sh
          bash scripts/build_ios.sh libffi glib libslirp || { echo "--- journaux Husk ---"; tail -n 80 build/logs/*.log; exit 1; }
          bash scripts/build_rppairing_ios.sh

      - name: Build Henge engine libraries
        run: |
          cd Vendor/Henge
          export HUSK="$HOME/Husk"
          ios/scripts/fetch_deps.sh
          make ios-lib IOS_DEPS="$HOME/Husk/build/ios-arm64/sysroot"
          tools/build_ios_restore.sh
          ls -la build/ios/*.a ios/deps/lib/

      - name: Build LinuxRunner app objects (harvest for TriOS)
        run: |
          bash Scripts/setup-linuxrunner-deps.sh
          cd Vendor/LinuxRunner
          python3 scripts/generate-gui-support-manifest.py --check
          scripts/bootstrap-macos.sh
          xcodebuild \
            -project iSH.xcodeproj -scheme LinuxRunner -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/trios-derived" \
            "LINUXRUNNER_CMAKE=$(command -v cmake)" \
            "LINUXRUNNER_SOURCE_COMMIT=$(git rev-parse HEAD)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 LINUXRUNNER_DIAGNOSTIC=NO \
            ROOT_BUNDLE_IDENTIFIER=dev.linuxrunner.app \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
          cd "$GITHUB_WORKSPACE"
          mkdir -p lr-libs
          OBJDIR="$(find Vendor/LinuxRunner/build/trios-derived -type d -path '*iSH-ARM64.build/Objects-normal/arm64' | head -1)"
          echo "Objets app LinuxRunner : $OBJDIR"
          test -n "$OBJDIR"
          rm -f "$OBJDIR/main.o" "$OBJDIR/AppDelegate.o"
          xcrun libtool -static -o lr-libs/liblr-app.a "$OBJDIR"/*.o
          for lib in libish.a libish_emu.a libfakefs.a libarchive.a; do
            f="$(find Vendor/LinuxRunner/build/trios-derived Vendor/LinuxRunner/build -name "$lib" 2>/dev/null | grep -i -m1 'iphoneos\|trios-derived' || find Vendor/LinuxRunner/build -name "$lib" | head -1)"
            echo "$lib : $f"; test -n "$f"; cp "$f" lr-libs/
          done
          if [ ! -f Vendor/LinuxRunner/build/shader-compiler/iphoneos/liblrshader.a ]; then
            (cd Vendor/LinuxRunner && scripts/build-shader-compiler.sh iphoneos)
          fi
          cp Vendor/LinuxRunner/build/shader-compiler/iphoneos/liblrshader.a lr-libs/
          ls -la lr-libs/
          # Ressources runtime à embarquer dans TriOS : le rootfs Alpine
          # téléchargé et vérifié (SHA-256 épinglé) pendant le build de
          # l'app d'origine, et le bundle de support GUI.
          mkdir -p lr-resources
          ROOTFS="$(find Vendor/LinuxRunner/build/trios-derived -name 'root.tar.gz' -path '*LinuxRunner.app*' | head -1)"
          echo "rootfs : $ROOTFS"; test -n "$ROOTFS"
          cp "$ROOTFS" lr-resources/root.tar.gz
          cp -R Vendor/LinuxRunner/app/LinuxRunner/GUISupport.bundle lr-resources/
          ls -la lr-resources/

      - name: Generate Engines.xcconfig (Henge + LinuxRunner linked)
        run: |
          cat > Config/Engines.xcconfig <<'XCC'
          // Généré en CI — Henge + LinuxRunner liés.
          OTHER_SWIFT_FLAGS = $(inherited) -DHENGE_LINKED -DLINUXRUNNER_LINKED
          GCC_PREPROCESSOR_DEFINITIONS = $(inherited) HENGE_LINKED=1 LINUXRUNNER_LINKED=1 LINUXRUNNER=1 GUEST_ARM64=1
          HEADER_SEARCH_PATHS = $(inherited) $(SRCROOT)/TriOS/Modules/Henge/Native $(SRCROOT)/TriOS/Modules/Kernarium/Native $(SRCROOT)/TriOS/Modules/LinuxRunner/Native $(SRCROOT)/Vendor/Henge/core $(SRCROOT)/Vendor/Henge/host $(SRCROOT)/Vendor/Henge/devices $(SRCROOT)/Vendor/LinuxRunner $(SRCROOT)/Vendor/LinuxRunner/app $(SRCROOT)/Vendor/LinuxRunner/app/LinuxRunner $(SRCROOT)/Vendor/LinuxRunner/deps/libarchive/libarchive
          LIBRARY_SEARCH_PATHS = $(inherited) $(SRCROOT)/Vendor/Henge/build/ios $(SRCROOT)/Vendor/Henge/ios/deps/lib $(SRCROOT)/lr-libs
          OTHER_LDFLAGS = $(inherited) -lhengevm -lhengerestore -lslirp -lglib-2.0 -lintl -lpcre2-8 -lhusk_rppairing -lz -liconv -lresolv -framework Metal -framework IOSurface -framework AudioToolbox -framework AVFAudio -framework CoreFoundation -ObjC -llr-app -lish -lish_emu -lfakefs -larchive -llrshader -llzma -lbz2 -lsqlite3 -lc++ -u _accessibilityfixes_init -framework MetalKit -framework CoreLocation -framework SystemConfiguration
          XCC
          cat Config/Engines.xcconfig

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TriOS.xcodeproj \
            -scheme TriOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'TriOS.app' | head -1)"
          echo "App : $APP_PATH"
          test -n "$APP_PATH"
          rm -rf build/Payload build/TriOS-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry TriOS-unsigned.ipa Payload)
          ls -lh build/TriOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriOS-unsigned-ipa
          path: build/TriOS-unsigned.ipa
          if-no-files-found: error
