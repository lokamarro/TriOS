name: Build unsigned IPA

# Construit TriOS SANS signature, avec le moteur Henge lié
# (HENGE_LINKED) : les pièces iOS de Husk et les bibliothèques de
# Vendor/Henge sont construites dans le même job, puis
# Config/Engines.xcconfig est généré pour lier le moteur.
# Publie un .ipa « unsigned » en artefact. Installation ensuite via
# SideStore / AltStore / TrollStore, qui re-signent l'IPA.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: TriOS unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install toolchain
        run: brew install meson ninja pkg-config cmake

      - name: Clone Husk (dependency of Henge)
        run: git clone --depth 1 https://github.com/Leviidev/Husk "$HOME/Husk"

      - name: Build Husk iOS pieces (sysroot + rppairing)
        run: |
          cd "$HOME/Husk"
          rustup target add aarch64-apple-ios
          bash scripts/fetch_sources.sh
          bash scripts/build_ios.sh libffi glib libslirp || { echo "--- journaux Husk ---"; tail -n 80 build/logs/*.log; exit 1; }
          bash scripts/build_rppairing_ios.sh

      - name: Build Henge engine libraries
        run: |
          cd Vendor/Henge
          export HUSK="$HOME/Husk"
          ios/scripts/fetch_deps.sh
          make ios-lib IOS_DEPS="$HOME/Husk/build/ios-arm64/sysroot"
          tools/build_ios_restore.sh
          ls -la build/ios/*.a ios/deps/lib/

      - name: Generate Engines.xcconfig (Henge linked)
        run: |
          cat > Config/Engines.xcconfig <<'XCC'
          // Généré en CI — Henge lié (même contenu que Scripts/build_engines.sh).
          OTHER_SWIFT_FLAGS = $(inherited) -DHENGE_LINKED
          GCC_PREPROCESSOR_DEFINITIONS = $(inherited) HENGE_LINKED=1
          HEADER_SEARCH_PATHS = $(inherited) $(SRCROOT)/TriOS/Modules/Henge/Native $(SRCROOT)/TriOS/Modules/Kernarium/Native $(SRCROOT)/TriOS/Modules/LinuxRunner/Native $(SRCROOT)/Vendor/Henge/core $(SRCROOT)/Vendor/Henge/host $(SRCROOT)/Vendor/Henge/devices
          LIBRARY_SEARCH_PATHS = $(inherited) $(SRCROOT)/Vendor/Henge/build/ios $(SRCROOT)/Vendor/Henge/ios/deps/lib
          OTHER_LDFLAGS = $(inherited) -lhengevm -lhengerestore -lslirp -lglib-2.0 -lintl -lpcre2-8 -lhusk_rppairing -lz -liconv -lresolv -framework Metal -framework IOSurface -framework AudioToolbox -framework AVFAudio -framework CoreFoundation
          XCC
          cat Config/Engines.xcconfig

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TriOS.xcodeproj \
            -scheme TriOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'TriOS.app' | head -1)"
          echo "App : $APP_PATH"
          test -n "$APP_PATH"
          rm -rf build/Payload build/TriOS-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry TriOS-unsigned.ipa Payload)
          ls -lh build/TriOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriOS-unsigned-ipa
          path: build/TriOS-unsigned.ipa
          if-no-files-found: error
